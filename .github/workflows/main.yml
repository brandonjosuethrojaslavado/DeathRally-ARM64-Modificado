name: Construye DeathRally ARM64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d project
          echo "Contenido:"
          find project -maxdepth 3 -type f | head -100

      - name: Preparar NDK
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "ndk;27.2.12479018"

      - name: Compilar APK
        run: |
          echo "Entrando al proyecto Android..."
          cd project/src

          echo "Contenido del proyecto:"
          ls -la

          echo "Compilando APK ARM64..."
          gradle assembleRelease --stacktrace --no-daemon
          
      - name: Buscar APK generado
        run: |
          echo "Buscando APK..."
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ningún APK."
            exit 1
          fi

          echo "APK encontrado: $APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-generado
          path: artifacts/app.apk
          if-no-files-found: error   
