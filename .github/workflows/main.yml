name: Construye DeathRally ARM64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d project
          echo "Contenido:"
          find project -maxdepth 3 -type f | head -100

      - name: Preparar NDK
        run: |
         sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "ndk;27.2.12479018"
              - name: Compilar APK
        run: |
          echo "Buscando proyecto Android..."
          find project -name "gradlew" -type f -print

          GRADLEW=$(find project -name "gradlew" -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew"
            echo "Archivos del proyecto:"
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          chmod +x "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          ./gradlew assembleRelease --stacktrace

      - name: Buscar APK generado
        run: |
          echo "Buscando APK..."
          find project -type f -name "*.apk" -print

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DeathRally-ARM64-APK
          path: project/**/*.apk
          if-no-files-found: error  
